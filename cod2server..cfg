// =====================================================================
//   Bitcore.cz - CoD2x Competitive Deathmatch Server Config
//   Ověřeno podle zdrojového kódu https://github.com/callofduty2x/CoD2x
// =====================================================================

// ---- 1. Síťové nastavení (musí být před načtením mapy) ----
set net_ip "0.0.0.0"                  // IP adresa serveru (0.0.0.0 = naslouchá na všech síťových rozhraních)
set net_port "28960"                  // Síťový UDP port serveru (výchozí pro CoD2 je 28960)
set dedicated 2                       // Režim serveru (0 = listen, 1 = LAN, 2 = veřejný internetový server)

// ---- 2. Základní informace o serveru a správa ----
set sv_hostname "Bitcore^2.^3cz ^2| ^7CoD2^2x ^7competitive ^1DM"          // Název serveru v prohlížeči
set scr_motd "Vitejte na ^2Bitcore^7.^2cz ^7competitive ^3DM ^7warmup serveru^8." // Zpráva dne (MOTD) při připojení
set g_motd "Vitejte na Bitcore.cz CoD2x competitive DM"                    // Doplňková zpráva serveru
sets _Location "CZ/SK"                // Veřejná informace o lokaci v detailu serveru
sets _Website "https://bitcore.cz"    // Veřejný odkaz na web v detailu serveru

set rcon_password ""                  // Heslo pro vzdálenou správu (/rcon) - DOPLŇ VLASTNÍ SILNÉ HESLO!
set g_password ""                     // Heslo pro vstup na server (prázdné = veřejně přístupný server)
set sv_privatePassword ""             // Heslo pro rezervované sloty
set sv_privateClients 0               // Počet rezervovaných slotů (z celkového sv_maxclients)
set sv_maxclients 10                  // Maximální počet hráčů na serveru (ponecháno 10)

// ---- 3. CoD2x specifické funkce (přímo z callofduty2x/CoD2x) ----
set g_competitive 1                   // CoD2x competitive režim: vynutí klientům 125-250 FPS, rate 25000, snaps 40, cl_maxpackets 125, vypne stíny a zakáže 'wait' skripty/makra
set sv_fps 40                         // Tickrate serveru (CoD2x zvyšuje limit ze 30 na 40 pro perfektní hitreg se snaps 40)
set sv_cracked 1                      // Povolí hráče bez originálního CD klíče (CoD2x místo klíče používá vlastní HWID bany v main/ban.txt)
set sv_rateLimiter 1                  // CoD2x integrovaná DDoS ochrana příchozích connectionless UDP paketů
set sv_playerBroadcastLimit 15        // CoD2x oprava neslyšitelných kroků za zdí (do 15 hráčů posílá pozice všech hráčů bez ohledu na PVS portály)
set sv_hideServerIp 0                 // CoD2x skrytí IP adresy na scoreboardu a v konzoli (0 = IP je vidět pro snadné sdílení, 1 = skryje IP na streamech)
set sv_update 1                       // CoD2x automatická aktualizace libCoD2x.so při startu Linux serveru (v Dockeru nastav 0)
set sv_updateZpam 1                   // CoD2x automatická aktualizace zPAM modu na pozadí (pokud je zPAM v main/ a zapnutý FastDL)
set sv_master1 "cod2master.activision.com" // Hlavní oficiální Activision master server
set sv_master2 "master.cod2x.me"      // Oficiální CoD2x master server
set sv_master3 "master.cod.pm"        // Aktivní komunitní CoD master server (cod.pm)

// ---- 4. CoD2x prostřelování zdí (Wallbang) a oprava brokovnice ----
set sv_wallbang 0                     // CoD2x prostřelování zdí puškami (0 = vypnuto / klasické CoD2, 1 = zapnuto)
set sv_wallbang_damage 0.6            // Násobič poškození kulky po prostřelení zdi (výchozí 0.6, platí při sv_wallbang 1)
set sv_wallbang_depth 24              // Maximální tloušťka prostřelitelné dřevěné stěny v jednotkách (výchozí 24)
set sv_wallbang_maxWalls 2            // Maximální počet zdí prostřelených jednou kulkou (výchozí 2)
set sv_wallbang_debug 0               // Debug výpis prostřelení střelci do chatu/obrazovky (0 = vypnuto)

// ---- 5. Síť, výkon a ochrana serveru (CoD2 1.3 engine) ----
set sv_maxRate 25000                  // Maximální přenosová rychlost na klienta v B/s (25000 = maximum v CoD2)
set sv_minPing 0                      // Minimální povolený ping (0 = bez omezení)
set sv_maxPing 120                    // Maximální povolený ping (120 ms udrží plynulou hru bez laggerů; 0 = bez omezení)
set sv_timeout 60                     // Čas v sekundách do odpojení hráče při výpadku spojení (rychleji uvolní slot)
set sv_zombietime 2                   // Doba v sekundách pro uvolnění slotu po odpojení hráče
set sv_reconnectlimit 3               // Limit pokusů o rychlé znovupřipojení
set sv_kickBanTime 300                // Doba dočasného banu v sekundách po vyhození příkazem /kick (300 s = 5 minut)
set sv_floodProtect 1                 // Ochrana proti spamování herního chatu
set sv_pure 1                         // Kontrola čistoty .iwd souborů (NUTNÉ MÍT 1, jinak server neuvidí hráči s výchozím filtrem Pure: Yes!)
set sv_punkbuster 0                   // PunkBuster vypnutý (nahrazen HWID systémem v CoD2x přes příkaz /banClient)
set sv_voice 0                        // Vypnutí vestavěného voice chatu
set sv_allowAnonymous 0               // Zakáže připojení hráčů bez vyplněného jména
set g_antilag 1                       // Kompenzace odezvy (antilag) pro přesnou registraci zásahů
set g_smoothClients 1                 // Vyhlazování pohybu hráčů na serveru
set g_no_script_spam 1                // Potlačení opakovaného výpisu chyb skriptů v konzoli serveru
set g_inactivity 180                  // Automatické vyhození AFK hráče po 180 sekundách nečinnosti (0 = vypnuto)
set g_allowVote 0                     // Hlasování hráčů (0 = vypnuto, aby hráči na DM nespamovali hlasování)
set g_deadChat 1                      // Povolí psaní do chatu i v okamžiku smrti

// ---- 6. Stahování souborů (FastDL) ----
set sv_allowDownload 1                // Povolí stahování chybějících souborů ze serveru
set sv_wwwDownload 0                  // Rychlé stahování přes HTTP/HTTPS (1 = zapnuto, CoD2x podporuje i https://)
set sv_wwwBaseURL ""                  // Základní URL adresa pro FastDL stahování
set sv_wwwDlDisconnected 0            // Neodpojovat klienta během HTTP stahování

// ---- 7. Pohyb a fyzika (standardní competitive hodnoty) ----
set g_speed 190                       // Rychlost pohybu hráčů (výchozí 190)
set g_gravity 800                     // Gravitace (výchozí 800)
set g_knockback 1000                  // Síla odhození při zásahu (výchozí 1000)
set g_playerCollisionEjectSpeed 25    // Rychlost odtlačení při kolizi dvou hráčů (výchozí 25)
set g_maxDroppedWeapons 16            // Maximální počet odhozených zbraní na zemi (1-32, výchozí 16)

// ---- 8. Herní režim Deathmatch (DM) a pravidla ----
set g_gametype "dm"                   // Herní mód Deathmatch (každý proti každému)
set scr_dm_timelimit 30               // Časový limit mapy v minutách (30 minut na mapu)
set scr_dm_scorelimit 0               // Limit zabití pro konec mapy (0 = bez limitu killů, hraje se čistě na čas jako warmup)
set scr_dm_roundlimit 0               // Limit kol (v DM se nepoužívá = 0)
set scr_dm_playerrespawndelay 0       // Prodleva respawnu v sekundách (0 = okamžitý respawn po smrti)
set scr_killcam 0                     // Killcam po smrti (0 = vypnuto, aby nic nezdržovalo okamžitý respawn)
set scr_spectatefree 1                // Volná kamera ve spectate režimu (1 = povoleno)
set scr_spectateenemy 1               // Sledování ostatních hráčů ve spectate režimu (1 = povoleno)
set scr_teambalance 0                 // Automatické vyvažování týmů (v DM vypnuto)
set scr_drawfriend 0                  // Ikony nad hlavami spoluhráčů (v DM vypnuto)
set scr_friendlyfire 0                // Zranění spoluhráčů (v DM vypnuto)

// ---- 9. Granáty a zbraně (Competitive DM warmup) ----
set scr_allow_fraggrenades 0          // Frag granáty (0 = vypnuto proti spamu na DM, 1 = povoleno)
set scr_allow_smokegrenades 0         // Smoke granáty (0 = vypnuto pro čistý výhled a vyšší FPS)

// Povolení/zakázání jednotlivých zbraní ve hře:
set scr_allow_shotgun 0               // Brokovnice (0 = zakázána pro competitive aim warmup, 1 = povolena)
set scr_allow_kar98k 1                // Kar98k (povoleno)
set scr_allow_kar98ksniper 1          // Scoped Kar98k (povoleno)
set scr_allow_mp40 1                  // MP40 (povoleno)
set scr_allow_mp44 1                  // MP44 (povoleno)
set scr_allow_g43 1                   // Gewehr 43 (povoleno)
set scr_allow_enfield 1               // Lee-Enfield (povoleno)
set scr_allow_enfieldsniper 1         // Scoped Lee-Enfield (povoleno)
set scr_allow_sten 1                  // Sten (povoleno)
set scr_allow_bren 1                  // Bren (povoleno)
set scr_allow_m1carbine 1             // M1A1 Carbine (povoleno)
set scr_allow_m1garand 1              // M1 Garand (povoleno)
set scr_allow_springfield 1           // Springfield Sniper (povoleno)
set scr_allow_thompson 1              // Thompson (povoleno)
set scr_allow_greasegun 1             // M3 Grease Gun (povoleno)
set scr_allow_bar 1                   // BAR (povoleno)
set scr_allow_nagant 1                // Mosin-Nagant (povoleno)
set scr_allow_nagantsniper 1          // Scoped Mosin-Nagant (povoleno)
set scr_allow_svt40 1                 // SVT-40 (povoleno)
set scr_allow_pps42 1                 // PPS-42 (povoleno)
set scr_allow_ppsh 1                  // PPSh-41 (povoleno)

// ---- 10. Logování serveru ----
set logfile 2                         // Logování konzole (0 = vypnuto, 1 = bufferované, 2 = okamžitý zápis)
set g_log "games_mp.log"              // Soubor pro ukládání herního logu
set g_logSync 1                       // Okamžitý synchronní zápis do herního logu (0 = vypnuto, 1 = zapnuto)

// ---- 11. Rotace map a startovní mapa (ponecháno beze změny) ----
set sv_mapRotation "gametype dm map mp_burgundy gametype dm map mp_carentan gametype dm map mp_toujane"
map mp_burgundy
heartbeat                             // Vynutí okamžité odeslání heartbeatu na master servery po načtení mapy
