// =====================================
//   CoD2X Competitive DM Server Config
// =====================================

// ---- Server info ----
set sv_hostname "^7Bitcore.cz ^1CoD2x competitive DM"
set scr_motd "Vitejte na Bitcore.cz Competitive DM warmup serveru."
set dedicated 2
set sv_maxclients 10
set sv_punkbuster 0
set sv_pure 0
set sv_authorizemode 0

// ---- Gametype ----
set g_gametype "dm"
set timelimit 60
set fraglimit 20

// ---- Competitive settings ----
set scr_allow_fraggrenades 1
set scr_allow_smokegrenades 0
set scr_allow_flashgrenades 0
set scr_allow_sprint 1
set scr_game_spectatetype 1
set scr_teambalance 0
set scr_drawfriend 0
set scr_friendlyfire 0

// ---- Movement / physics ----
set g_speed 190
set g_gravity 800
set g_knockback 1000
set g_playerCollision 1
set g_playerEjection 1

// ---- Respawn ----
set scr_dm_playerrespawndelay 0
set scr_dm_roundlimit 0
set scr_dm_scorelimit 0

// ---- Hit registration / performance ----
set sv_fps 20
set sv_maxrate 25000
set sv_minPing 0
set sv_maxPing 0
set sv_timeout 30
set sv_reconnectlimit 3
set sv_kickBanTime 0

// ---- Anti‑cheat / exploit fixes ----
set g_no_script_spam 1
set g_no_script_errors 1
set g_antilag 1
set g_antilagvis 0
set g_logsync 2
set g_log "games_mp.log"
set logfile 2

// ---- Disable unnecessary effects ----
set scr_enable_hiticon 1
set scr_enable_healthregen 0
set scr_enable_shellshock 0
set scr_enable_blood 0
set scr_enable_hitmarkers 0

// ---- Map rotation ----
set sv_mapRotation "gametype dm map mp_burgundy gametype dm map mp_carentan gametype dm map mp_toujane"

// ---- Start map ----
map mp_burgundy

// ---- Network ----
set net_ip "0.0.0.0"
set net_port "28960"
